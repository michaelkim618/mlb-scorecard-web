<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Prediction History | MLB Scorecard</title>
<style>
:root {
  --bg:          #f0f4f8;
  --bg2:         #ffffff;
  --card:        #ffffff;
  --card-border: #d1dbe8;
  --card-hover:  #f7fafc;
  --text:        #1e293b;
  --text-sub:    #475569;
  --muted:       #94a3b8;
  --accent:      #2563eb;
  --accent-dim:  #dbeafe;
  --green:       #16a34a;
  --green-dim:   #bbf7d0;
  --green-bg:    #f0fdf4;
  --red:         #dc2626;
  --red-dim:     #fecaca;
  --red-bg:      #fff1f2;
  --yellow:      #d97706;
  --yellow-dim:  #fde68a;
  --border-line: 1px solid #d1dbe8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── 메인 사이트 스타일 네비바 ── */
.site-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.96);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid #e2e8f0;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  justify-content: space-between;
  box-shadow: 0 1px 0 rgba(0,0,0,.04);
}
.site-nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.site-nav-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, #0EA5E9, #0284C7);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: 0 2px 8px rgba(14,165,233,0.3);
  flex-shrink: 0;
}
.site-nav-wordmark {
  font-size: 17px;
  font-weight: 800;
  color: #1e293b;
  letter-spacing: -0.4px;
}
.site-nav-wordmark span { color: #0EA5E9; }
.site-nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
}
.site-nav-link {
  font-size: 13px;
  font-weight: 500;
  color: #64748b;
  text-decoration: none;
  transition: color .15s;
  white-space: nowrap;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}
.site-nav-link:hover { color: #1e293b; }
.site-nav-link.active {
  color: #0EA5E9;
  font-weight: 700;
}
.site-nav-follow {
  background: #1e293b;
  color: #fff;
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: opacity .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.site-nav-follow:hover { opacity: 0.85; }
@media (max-width: 768px) {
  .site-nav-links { display: none; }
  .site-nav-follow { display: none; }
}

/* ── 시즌 요약 바 ── */
.season-summary {
  background: var(--bg2);
  border-bottom: var(--border-line);
  padding: 16px 24px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
}
.stat-pill {
  background: var(--card);
  border: var(--border-line);
  border-radius: 12px;
  padding: 12px 18px;
  min-width: 120px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.stat-pill .s-val { font-size: 24px; font-weight: 800; line-height: 1.2; }
.stat-pill .s-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.pill-green .s-val { color: var(--green); }
.pill-blue  .s-val { color: var(--accent); }
.pill-yellow .s-val { color: var(--yellow); }

/* ── 정확도 트렌드 차트 ── */
.trend-section {
  background: var(--bg2);
  border-bottom: var(--border-line);
  padding: 20px 24px;
}
.trend-section h2 {
  font-size: 14px; font-weight: 700; color: var(--text);
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.trend-chart-wrap {
  overflow-x: auto;
  padding-bottom: 4px;
}
.trend-chart {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  min-width: 600px;
  height: 100px;
  padding: 0 4px;
}
.trend-bar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex: 1;
  min-width: 22px;
  cursor: pointer;
  transition: opacity .15s;
}
.trend-bar-wrap:hover { opacity: .8; }
.trend-bar-wrap.selected .trend-bar { outline: 2px solid var(--accent); outline-offset: 1px; }
.trend-bar {
  width: 100%;
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: all .3s ease;
}
.trend-bar.bar-high   { background: linear-gradient(180deg, #22c55e, #16a34a); }
.trend-bar.bar-mid    { background: linear-gradient(180deg, #fbbf24, #d97706); }
.trend-bar.bar-low    { background: linear-gradient(180deg, #f87171, #dc2626); }
.trend-label {
  font-size: 9px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  height: 36px;
  display: flex;
  align-items: center;
}
.trend-pct {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-sub);
}

/* ── 메인 레이아웃 ── */
.main-wrap {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
  min-height: calc(100vh - 220px);
}

/* ── 날짜 사이드바 ── */
.date-sidebar {
  background: var(--bg2);
  border-right: var(--border-line);
  overflow-y: auto;
  max-height: calc(100vh - 220px);
  position: sticky;
  top: 0;
}
.sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: var(--border-line);
  position: sticky;
  top: 0;
  background: var(--bg2);
  z-index: 10;
}
.sidebar-header input {
  width: 100%;
  background: var(--bg);
  border: var(--border-line);
  color: var(--text);
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  outline: none;
  transition: border-color .15s;
}
.sidebar-header input:focus { border-color: var(--accent); }

.month-group { border-bottom: var(--border-line); }
.month-label {
  padding: 10px 16px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .8px;
  background: var(--bg);
}
.date-item {
  padding: 10px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #f1f5f9;
  transition: background .1s;
  user-select: none;
}
.date-item:hover { background: var(--card-hover); }
.date-item.active {
  background: var(--accent-dim);
  border-left: 3px solid var(--accent);
}
.date-item.active .di-date { color: var(--accent); }
.di-date {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  min-width: 80px;
}
.di-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  margin-left: auto;
}
.di-acc {
  font-size: 15px;
  font-weight: 800;
  line-height: 1;
}
.di-acc.high { color: var(--green); }
.di-acc.mid  { color: var(--yellow); }
.di-acc.low  { color: var(--red); }
.di-count {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.di-bar {
  width: 48px;
  height: 4px;
  background: var(--bg);
  border-radius: 2px;
  overflow: hidden;
}
.di-bar-fill {
  height: 100%;
  border-radius: 2px;
}

/* ── 경기 목록 패널 ── */
.games-panel {
  padding: 20px 24px 48px;
  overflow-y: auto;
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.panel-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
}
.panel-date-acc {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.day-stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: var(--border-line);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
}
.day-stat-pill .ds-val {
  font-size: 16px;
  font-weight: 800;
}

.filter-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.flt-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: var(--border-line);
  background: var(--card);
  color: var(--text-sub);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.flt-btn:hover { border-color: var(--accent); color: var(--accent); }
.flt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── 경기 카드 ── */
.game-row {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: transform .12s, box-shadow .12s;
}
.game-row:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.game-row.is-hit  { border-left: 4px solid var(--green); }
.game-row.is-miss { border-left: 4px solid var(--red); }
.game-row.is-pending { border-left: 4px solid var(--muted); }

/* header bar */
.gr-header {
  background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 100%);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.gr-teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gr-team  { font-size: 14px; font-weight: 700; color: #f1f5f9; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.gr-vs    { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.6); }
.gr-score-box { display:inline-flex; align-items:center; gap:3px; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.25); border-radius:6px; padding:2px 9px; margin:0 4px; }
.gr-score     { font-size:16px; font-weight:900; color:#cbd5e1; min-width:14px; text-align:center; }
.gr-score-win { color:#ffffff; text-shadow: 0 0 8px rgba(255,255,255,.4); }
.gr-score-lose{ color:#94a3b8; }
.gr-score-sep { font-size:12px; color:rgba(255,255,255,.45); margin:0 2px; font-weight:600; }
.gr-badges { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.gr-status {
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 99px; white-space: nowrap;
}
.gs-final   { background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); }
.gs-sched   { background: rgba(255,255,255,.06); color: rgba(255,255,255,.4); }
.gs-dh      { background: rgba(124,58,237,.2); color: #c4b5fd; border: 1px solid rgba(124,58,237,.4); }
.verdict-badge {
  font-size: 10px; font-weight: 800;
  padding: 2px 9px; border-radius: 6px; white-space: nowrap;
}
.vb-hit  { background: #dcfce7; color: #166534; }
.vb-miss { background: #fee2e2; color: #991b1b; }
.vb-pend { background: rgba(255,255,255,.1); color: rgba(255,255,255,.5); }
.high-conf-badge {
  font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
  background: #fef9c3; color: #92400e; border: 1px solid #fde68a;
}
.low-conf-badge {
  font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
  background: #f5f3ff; color: #6d28d9; border: 1px solid #c4b5fd;
}

/* two-column SP comparison */
.gr-sp-grid {
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  gap: 0;
}
.gr-sp-divider {
  background: var(--card-border);
  align-self: stretch;
  margin: 12px 0;
}
.gr-sp-col {
  padding: 14px 16px 12px;
}
.gr-sp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.gr-sp-team-label {
  font-size: 9px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px;
}
.gr-sp-team-name {
  font-size: 14px; font-weight: 800; color: var(--text);
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gr-sp-prob {
  font-size: 22px; font-weight: 900; line-height: 1;
  color: var(--accent); flex-shrink: 0;
}
.gr-sp-prob sub { font-size: 12px; font-weight: 600; color: var(--muted); }

/* ERA + trend row */
.gr-era-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.gr-era-val {
  font-size: 20px; font-weight: 800; color: var(--text); line-height: 1;
}
.gr-era-lbl {
  font-size: 9px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px;
}
.trend-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px;
}
.trend-hot  { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
.trend-cold { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.trend-neutral { background: var(--bg); color: var(--muted); border: var(--border-line); }

/* scorecard bars inside sp col */
.gr-sc-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
}
.gr-sc-label {
  font-size: 9px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; width: 28px; flex-shrink: 0;
}
.gr-sc-track {
  flex: 1; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;
}
.gr-sc-fill { height: 100%; border-radius: 3px; }
.scf-sp  { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
.scf-bp  { background: linear-gradient(90deg, #0891b2, #22d3ee); }
.gr-sc-val {
  font-size: 11px; font-weight: 700; color: var(--text);
  width: 24px; text-align: right; flex-shrink: 0;
}

/* BP ERA sub-label */
.gr-bp-era {
  font-size: 10px; color: var(--muted); margin-top: 2px;
}
.gr-bp-era span { color: var(--text-sub); font-weight: 600; }

/* bottom: win prob bar + pick */
.gr-bottom {
  border-top: var(--border-line);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.gr-prob-wrap { flex: 1; }
.gr-prob-lbl  { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.gr-prob-bar  {
  display: flex; height: 18px; border-radius: 5px; overflow: hidden;
  font-size: 10px; font-weight: 700;
}
.gr-prob-away {
  background: linear-gradient(90deg, #1d4ed8, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; white-space: nowrap; overflow: hidden;
}
.gr-prob-home {
  background: linear-gradient(90deg, #15803d, #22c55e);
  display: flex; align-items: center; justify-content: center;
  color: #fff; white-space: nowrap; overflow: hidden;
}
.gr-prob-labels {
  display: flex; justify-content: space-between;
  font-size: 9px; color: var(--muted); margin-top: 2px;
}
.gr-prob-labels .away-lbl { color: #93c5fd; font-weight: 600; }
.gr-prob-labels .home-lbl { color: #86efac; font-weight: 600; }

.gr-pick-box {
  flex-shrink: 0; text-align: right;
}
.gr-pick-lbl { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.gr-pick-team { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.gr-result-line { font-size: 11px; color: var(--green); font-weight: 600; white-space: nowrap; }
.gr-result-miss { color: var(--red); }
.gr-result-pending { color: var(--muted); font-style: italic; }

@media (max-width: 640px) {
  .gr-sp-grid { grid-template-columns: 1fr; }
  .gr-sp-divider { display: none; }
  .gr-sp-col:first-child { border-bottom: var(--border-line); padding-bottom: 10px; }
  .gr-bottom { flex-direction: column; align-items: stretch; }
  .gr-pick-box { text-align: left; }
}

/* ── 빈 상태 ── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.empty-state .emo { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

/* ── 로딩 ── */
.loading-wrap {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block;
  width: 24px; height: 24px;
  border: 3px solid var(--card-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin-bottom: 12px;
}

/* ── 반응형 ── */
@media (max-width: 860px) {
  .main-wrap { grid-template-columns: 1fr; }
  .date-sidebar {
    max-height: 220px;
    position: static;
    border-right: none;
    border-bottom: var(--border-line);
  }
  .trend-chart { min-width: 400px; }
  header { padding: 12px 16px; }
  .season-summary { padding: 14px 16px; }
  .games-panel { padding: 16px 14px 48px; }
}
@media (max-width: 540px) {
  header h1 { font-size: 15px; }
  .stat-pill { min-width: 90px; padding: 10px 12px; }
  .gr-body { grid-template-columns: 1fr 1fr; gap: 8px; }
}

/* ── Full GameCard expansion ── */
.gc-expand-btn {
  width: 100%;
  background: none;
  border: none;
  border-top: 1px solid var(--card-border);
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, color 0.15s;
}
.gc-expand-btn:hover { background: #f1f5f9; color: var(--text); }

.gc-detail {
  border-top: 1px solid var(--card-border);
  background: #f8fafc;
  padding: 16px;
  display: none;
}
.gc-detail.open { display: block; }

.gc-sp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 640px) { .gc-sp-grid { grid-template-columns: 1fr; } }

.gc-team-panel {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  border: 1px solid var(--card-border);
}
.gc-panel-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.gc-pitcher-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.gc-pitcher-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.gc-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px; margin-bottom: 4px; }
.gc-stat-cell { display: flex; flex-direction: column; }
.gc-stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.gc-stat-val { font-size: 12px; font-weight: 700; color: var(--text); }

.gc-trend-row { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
.gc-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; }
.gc-badge-hot    { background: #FEF3C7; color: #92400E; }
.gc-badge-cold   { background: #EFF6FF; color: #1E40AF; }
.gc-badge-stable { background: #F1F5F9; color: #475569; }
.gc-badge-rest   { background: #F1F5F9; color: #64748B; }
.gc-badge-shortrest { background: #FFF1F2; color: #991B1B; border: 1px solid #FCA5A5; }
.gc-badge-extrarest { background: #F0FDF4; color: #166534; border: 1px solid #86EFAC; }

.gc-divider { height: 1px; background: var(--card-border); margin: 10px 0; }

.gc-split-box { background: #f8fafc; border: 1px solid var(--card-border); border-radius: 7px; padding: 7px 9px; margin-top: 6px; }
.gc-split-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-wrap: wrap; gap: 4px; }
.gc-split-title { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.gc-split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.gc-split-col { padding: 5px 7px; border-radius: 6px; border: 1px solid transparent; }

.gc-split-col-lbl { font-size: 9px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
.gc-split-col.used .gc-split-col-lbl { color: #0369A1; }

.gc-split-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
.gc-split-note { font-size: 9px; color: var(--muted); border-top: 1px solid var(--card-border); padding-top: 5px; margin-top: 5px; }

.gc-sc-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.gc-sc-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.gc-sc-bar-lbl { width: 56px; font-size: 10px; color: var(--muted); flex-shrink: 0; }
.gc-sc-bar-track { flex: 1; height: 5px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
.gc-sc-bar-fill { height: 100%; border-radius: 99px; }
.gc-sc-bar-val { width: 26px; font-size: 11px; font-weight: 700; color: var(--text); text-align: right; }
.gc-total-row { display: flex; justify-content: space-between; margin-top: 8px; padding: 6px 8px; border-radius: 6px; }
.gc-total-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }

.gc-badges-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--card-border); }

.gc-edge-bar { margin-bottom: 12px; padding: 6px 12px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.gc-edge-bar.positive { background: #f0fdf4; border: 1px solid #86efac; }
.gc-edge-bar.negative { background: #fff1f2; border: 1px solid #fca5a5; }

.gc-edge-val-neg { font-weight: 700; color: var(--red); }

.gc-detail-loading { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<!-- ── 메인 사이트 스타일 네비바 ── -->
<nav class="site-nav">
  <a href="/" class="site-nav-logo">
    <div class="site-nav-icon">⚾</div>
    <span class="site-nav-wordmark">MLB<span>Scorecard</span></span>
  </a>
  <div class="site-nav-links">
    <a href="/#slate"   class="site-nav-link">Today's Picks</a>
    <a href="/#stats"   class="site-nav-link">Season Stats</a>
    <a href="/history.html" class="site-nav-link active">History</a>
    <a href="/#news"    class="site-nav-link">News</a>
    <a href="/blog"     class="site-nav-link">Blog</a>
    <a href="/community" class="site-nav-link">Community</a>
  </div>
  <a href="https://twitter.com/MLB_Scorecard" target="_blank" rel="noreferrer" class="site-nav-follow">
    Follow @MLB_Scorecard
  </a>
</nav>

<!-- ── 시즌 요약 ── -->
<div class="season-summary" id="season-summary">
  <div style="color:var(--muted);font-size:13px;">Loading season data…</div>
</div>

<!-- ── 정확도 트렌드 차트 ── -->
<div class="trend-section">
  <h2>📈 Daily Accuracy Trend</h2>
  <div class="trend-chart-wrap">
    <div class="trend-chart" id="trend-chart">
      <div class="loading-wrap" style="padding:20px;width:100%">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── 메인: 사이드바 + 경기 목록 ── -->
<div class="main-wrap">

  <!-- 날짜 사이드바 -->
  <div class="date-sidebar" id="date-sidebar">
    <div class="sidebar-header">
      <input type="text" id="date-search" placeholder="Search date (e.g. 08-15)" oninput="filterDates(this.value)">
    </div>
    <div id="date-list">
      <div class="loading-wrap" style="padding:30px 16px;">
        <div class="spinner"></div>
        <div style="margin-top:8px;font-size:12px;">Loading data…</div>
      </div>
    </div>
  </div>

  <!-- 경기 목록 패널 -->
  <div class="games-panel" id="games-panel">
    <div class="empty-state" id="panel-empty">
      <div class="emo">📅</div>
      <p>Select a date on the left<br>to view game records for that day.</p>
    </div>
    <div id="panel-content" style="display:none">
      <div class="panel-header">
        <div class="panel-title" id="panel-title">—</div>
        <div class="panel-date-acc" id="panel-stats"></div>
      </div>
      <div class="filter-bar">
        <button class="flt-btn active" onclick="setFilter('all',this)">All</button>
        <button class="flt-btn" onclick="setFilter('hit',this)">✅ Correct</button>
        <button class="flt-btn" onclick="setFilter('miss',this)">❌ Miss</button>
        <button class="flt-btn" onclick="setFilter('high',this)">⭐ High Conf</button>
      </div>
      <div id="games-list"></div>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════
//  팀 컬러
// ════════════════════════════════════════
const TEAM_COLORS_MAP = {
  'ARI':'#A71930','ATL':'#CE1141','BAL':'#DF4601','BOS':'#BD3039',
  'CHC':'#0E3386','CWS':'#27251F','CIN':'#C6011F','CLE':'#00385D',
  'COL':'#333366','DET':'#0C2340','HOU':'#002D62','KC':'#004687',
  'LAA':'#BA0021','LAD':'#005A9C','MIA':'#00A3E0','MIL':'#12284B',
  'MIN':'#002B5C','NYM':'#002D72','NYY':'#003087','OAK':'#003831',
  'PHI':'#E81828','PIT':'#27251F','SD':'#2F241D','SF':'#FD5A1E',
  'SEA':'#0C2C56','STL':'#C41E3A','TB':'#092C5C','TEX':'#003278',
  'TOR':'#134A8E','WSH':'#AB0003',
};
function TEAM_COLOR(name) { return TEAM_COLORS_MAP[shortTeam(name)] || '#64748B'; }

// ════════════════════════════════════════
//  데이터 & 상태
// ════════════════════════════════════════
let allGames = [];
let byDate   = {};
let dateList = [];
let selectedDate = null;
let currentFilter = 'all';

const DATA_URL_PRIMARY  = 'season_results.json';
const DATA_URL_FALLBACK = 'https://raw.githubusercontent.com/michaelkim618/mlb-scorecard-web/main/public/season_results.json';

// ════════════════════════════════════════
//  초기 로드
// ════════════════════════════════════════
async function fetchData() {
  if (location.protocol === 'file:') {
    const res = await fetch(DATA_URL_FALLBACK + '?t=' + Date.now());
    return res.json();
  }
  try {
    const res = await fetch(DATA_URL_PRIMARY + '?t=' + Date.now());
    if (!res.ok) throw new Error('primary failed');
    return res.json();
  } catch {
    const res = await fetch(DATA_URL_FALLBACK + '?t=' + Date.now());
    return res.json();
  }
}

async function init() {
  try {
    const data = await fetchData();
    allGames   = data.games || [];
    buildByDate();
    renderSeasonSummary();
    renderTrendChart();
    renderDateSidebar();
    const urlDate = new URLSearchParams(location.search).get('date');
    if (urlDate && byDate[urlDate]) selectDate(urlDate);
    else if (dateList.length) selectDate(dateList[dateList.length - 1]);
  } catch(e) {
    document.getElementById('season-summary').innerHTML =
      `<div style="color:var(--red);font-size:13px;">❌ Failed to load data: ${e.message}</div>`;
  }
}

function buildByDate() {
  byDate = {};
  allGames.forEach(g => {
    const d = g.date;
    if (!d) return;
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(g);
  });
  dateList = Object.keys(byDate).sort();
}

// ════════════════════════════════════════
//  날짜별 통계 계산
// ════════════════════════════════════════
function calcStats(games) {
  const confirmed = games.filter(g => g.actual_winner);
  const hits   = confirmed.filter(g => g.correct).length;
  const total  = confirmed.length;
  const pct    = total ? Math.round(hits / total * 100) : null;
  const highConf = confirmed.filter(g => g.high_conf);
  const hcHits   = highConf.filter(g => g.correct).length;
  return { hits, total, pct, highConf: highConf.length, hcHits, pending: games.length - total };
}

// ════════════════════════════════════════
//  시즌 요약
// ════════════════════════════════════════
function renderSeasonSummary() {
  const s = calcStats(allGames);
  const streak = calcStreak();
  const bestDay = dateList.reduce((best, d) => {
    const st = calcStats(byDate[d]);
    return st.pct > (best.pct || 0) ? { date: d, pct: st.pct } : best;
  }, {});

  document.getElementById('season-summary').innerHTML = `
    <div class="stat-pill pill-green">
      <div class="s-val">${s.pct ?? '—'}%</div>
      <div class="s-lbl">Season Accuracy</div>
    </div>
    <div class="stat-pill">
      <div class="s-val">${s.hits} / ${s.total}</div>
      <div class="s-lbl">Correct / Total</div>
    </div>
    <div class="stat-pill pill-blue">
      <div class="s-val">${dateList.length} days</div>
      <div class="s-lbl">Tracking Period</div>
    </div>
    <div class="stat-pill pill-yellow">
      <div class="s-val">${bestDay.pct ?? '—'}%</div>
      <div class="s-lbl">Best Day (${bestDay.date ? fmtDate(bestDay.date) : '—'})</div>
    </div>
    <div class="stat-pill">
      <div class="s-val">${streak.n}${streak.type === 'hit' ? '🔥' : streak.type === 'miss' ? '🧊' : ''}</div>
      <div class="s-lbl">Current ${streak.type === 'hit' ? '50%+ Streak' : streak.type === 'miss' ? 'Sub-50% Streak' : '—'}</div>
    </div>
  `;
}

function calcStreak() {
  const rev = [...dateList].reverse();
  if (!rev.length) return { n: 0, type: 'none' };
  const firstSt = calcStats(byDate[rev[0]]);
  if (firstSt.pct === null) return { n: 0, type: 'none' };
  const type = firstSt.pct >= 50 ? 'hit' : 'miss';
  let n = 0;
  for (const d of rev) {
    const st = calcStats(byDate[d]);
    if (st.pct === null) break;
    if (type === 'hit' && st.pct >= 50) n++;
    else if (type === 'miss' && st.pct < 50) n++;
    else break;
  }
  return { n, type };
}

// ════════════════════════════════════════
//  트렌드 차트
// ════════════════════════════════════════
function renderTrendChart() {
  const wrap = document.getElementById('trend-chart');
  if (!dateList.length) { wrap.innerHTML = '<div style="color:var(--muted);padding:20px;">No data</div>'; return; }

  const maxH = 80;
  wrap.innerHTML = dateList.map(d => {
    const st  = calcStats(byDate[d]);
    const pct = st.pct ?? 0;
    const h   = Math.max(4, Math.round(pct / 100 * maxH));
    const cls = pct >= 70 ? 'bar-high' : pct >= 55 ? 'bar-mid' : 'bar-low';
    const short = d.slice(5);
    return `
      <div class="trend-bar-wrap" onclick="selectDate('${d}')" id="tbar-${d}" title="${d}: ${pct}% (${st.hits}/${st.total})">
        <div class="trend-pct" style="opacity:1;font-size:8px">${pct}%</div>
        <div class="trend-bar ${cls}" style="height:${h}px"></div>
        <div class="trend-label">${short}</div>
      </div>`;
  }).join('');
}

function updateTrendSelection(date) {
  document.querySelectorAll('.trend-bar-wrap').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`tbar-${date}`);
  if (el) {
    el.classList.add('selected');
    el.querySelector('.trend-pct').style.opacity = '1';
    el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
}

// ════════════════════════════════════════
//  날짜 사이드바
// ════════════════════════════════════════
function renderDateSidebar(filter = '') {
  const el = document.getElementById('date-list');
  const filtered = dateList.filter(d => !filter || d.includes(filter)).reverse();
  if (!filtered.length) {
    el.innerHTML = '<div style="padding:20px 16px;color:var(--muted);font-size:12px;">No results</div>';
    return;
  }

  const byMonth = {};
  filtered.forEach(d => {
    const m = d.slice(0, 7);
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(d);
  });

  el.innerHTML = Object.keys(byMonth).sort().reverse().map(m => {
    const monthLabel = (() => {
      const [y, mo] = m.split('-');
      return `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(mo)-1]} ${y}`;
    })();
    const items = byMonth[m].map(d => {
      const st = calcStats(byDate[d]);
      const pct = st.pct ?? 0;
      const cls = pct >= 70 ? 'high' : pct >= 55 ? 'mid' : 'low';
      const barColor = pct >= 70 ? '#16a34a' : pct >= 55 ? '#d97706' : '#dc2626';
      return `
        <div class="date-item${selectedDate === d ? ' active' : ''}" id="ditem-${d}" onclick="selectDate('${d}')">
          <div>
            <div class="di-date">${fmtDate(d)}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:1px;">${st.total} games${st.pending > 0 ? ` (${st.pending} pending)` : ''}</div>
          </div>
          <div class="di-right">
            <div class="di-acc ${cls}">${st.pct !== null ? st.pct + '%' : '—'}</div>
            <div class="di-bar"><div class="di-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
            <div class="di-count">${st.hits}W ${st.total - st.hits}L</div>
          </div>
        </div>`;
    }).join('');
    return `<div class="month-group"><div class="month-label">${monthLabel}</div>${items}</div>`;
  }).join('');
}

function filterDates(val) {
  renderDateSidebar(val.trim());
}

// ════════════════════════════════════════
//  날짜 선택 → 경기 목록
// ════════════════════════════════════════
function selectDate(date) {
  selectedDate = date;

  document.querySelectorAll('.date-item').forEach(el => el.classList.remove('active'));
  const ditem = document.getElementById(`ditem-${date}`);
  if (ditem) {
    ditem.classList.add('active');
    ditem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  updateTrendSelection(date);

  const url = new URL(location.href);
  url.searchParams.set('date', date);
  history.replaceState(null, '', url);

  renderGamesPanel(date);
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.flt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (selectedDate) renderGamesPanel(selectedDate);
}

// ════════════════════════════════════════
//  경기 목록 렌더링
// ════════════════════════════════════════
function renderGamesPanel(date) {
  const games  = byDate[date] || [];
  const st     = calcStats(games);

  document.getElementById('panel-empty').style.display   = 'none';
  document.getElementById('panel-content').style.display = 'block';
  document.getElementById('panel-title').textContent     = fmtDateLong(date);

  const pctColor = st.pct >= 70 ? 'var(--green)' : st.pct >= 55 ? 'var(--yellow)' : st.pct !== null ? 'var(--red)' : 'var(--muted)';
  document.getElementById('panel-stats').innerHTML = `
    <div class="day-stat-pill">
      <span>Accuracy</span>
      <span class="ds-val" style="color:${pctColor}">${st.pct !== null ? st.pct + '%' : '—'}</span>
    </div>
    <div class="day-stat-pill">
      <span>✅</span><span class="ds-val" style="color:var(--green)">${st.hits}</span>
      <span>❌</span><span class="ds-val" style="color:var(--red)">${st.total - st.hits}</span>
    </div>
    ${st.highConf > 0 ? `<div class="day-stat-pill">⭐ HC <span class="ds-val">${st.hcHits}/${st.highConf}</span></div>` : ''}
    ${st.pending > 0 ? `<div class="day-stat-pill" style="color:var(--muted)">⏳ Pending ${st.pending}</div>` : ''}
  `;

  let filtered = games;
  if (currentFilter === 'hit')  filtered = games.filter(g => g.correct === true);
  if (currentFilter === 'miss') filtered = games.filter(g => g.actual_winner && g.correct === false);
  if (currentFilter === 'high') filtered = games.filter(g => g.high_conf);

  const list = document.getElementById('games-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state" style="padding:40px 0"><div class="emo">🔍</div><p>No games match this filter.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map((g, i) => renderGameRow(g, date, i)).join('');
}

function renderGameRow(g, date, idx) {
  const hasResult = !!g.actual_winner;
  const isHit     = hasResult && g.correct;
  const isMiss    = hasResult && !g.correct;
  const rowClass  = isHit ? 'is-hit' : isMiss ? 'is-miss' : 'is-pending';

  const awayProb = g.pick === g.away ? g.pick_prob : (100 - g.pick_prob);
  const homeProb = 100 - awayProb;

  const aSp = g.away_sp_score || 0;
  const hSp = g.home_sp_score || 0;
  const aBp = g.away_bp_score || 0;
  const hBp = g.home_bp_score || 0;

  const awayShort = shortTeam(g.away);
  const homeShort = shortTeam(g.home);
  const awayColor = TEAM_COLOR(g.away);
  const homeColor = TEAM_COLOR(g.home);

  const trendBadge = t => {
    if (t === 'hot')  return '<span class="trend-badge trend-hot">🔥 Hot</span>';
    if (t === 'cold') return '<span class="trend-badge trend-cold">❄️ Cold</span>';
    return '<span class="trend-badge trend-neutral">— Stable</span>';
  };

  const eraColor = era => {
    if (!era) return 'var(--text)';
    if (era < 3.0) return 'var(--green)';
    if (era < 4.5) return 'var(--text)';
    return 'var(--red)';
  };

  const dhBadge  = g.game_number === 2 ? '<span class="gr-status gs-dh">DH-2</span>' : '';
  const verdBadge = hasResult
    ? `<span class="verdict-badge ${isHit ? 'vb-hit' : 'vb-miss'}">${isHit ? '✅ Correct' : '❌ Miss'}</span>`
    : `<span class="verdict-badge vb-pend">⏳ Pending</span>`;
  const hcBadge  = g.high_conf      ? '<span class="high-conf-badge">⭐ High Conf</span>' : '';
  const lcBadge  = g.low_confidence ? '<span class="low-conf-badge">🔮 Low Conf</span>'  : '';

  // Premium/toss-up banner
  const pickProb = Math.round(g.pick_prob);
  let bannerHtml = '';
  if (pickProb >= 63) {
    bannerHtml = `<div style="background:linear-gradient(90deg,#F59E0B,#FBBF24);padding:5px 16px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:11px;font-weight:800;color:#78350F;letter-spacing:0.5px">⭐ PREMIUM PICK</span>
      <span style="font-size:10px;font-weight:700;color:#92400E">${pickProb}% Confidence</span>
    </div>`;
  }

  const spCol = (team, short, color, prob, era, trend, sp, bp, bpEra, isAway) => `
    <div class="gr-sp-col">
      <div class="gr-sp-header">
        <div>
          <div class="gr-sp-team-label">${isAway ? '✈️ Away' : '🏠 Home'} · Starting Pitcher</div>
          <div class="gr-sp-team-name" style="color:${color}">${team}</div>
        </div>
        <div class="gr-sp-prob">${Math.round(prob)}<sub>%</sub></div>
      </div>
      <div class="gr-era-row">
        ${era ? `<div>
          <div class="gr-era-lbl">ERA</div>
          <div class="gr-era-val" style="color:${eraColor(era)}">${era.toFixed(2)}</div>
        </div>` : ''}
        ${trendBadge(trend)}
      </div>
      <div class="gr-sc-row">
        <div class="gr-sc-label">SP</div>
        <div class="gr-sc-track"><div class="gr-sc-fill scf-sp" style="width:${sp}%"></div></div>
        <div class="gr-sc-val">${Math.round(sp)}</div>
      </div>
      <div class="gr-sc-row">
        <div class="gr-sc-label">BP</div>
        <div class="gr-sc-track"><div class="gr-sc-fill scf-bp" style="width:${bp}%"></div></div>
        <div class="gr-sc-val">${Math.round(bp)}</div>
      </div>
      ${bpEra ? `<div class="gr-bp-era">Bullpen ERA <span>${bpEra.toFixed(2)}</span></div>` : ''}
    </div>`;

  const resultLine = hasResult
    ? `<span class="gr-result-line${isHit ? '' : ' gr-result-miss'}">🏆 ${g.actual_winner}</span>`
    : `<span class="gr-result-pending">⏳ Awaiting result</span>`;

  const gameId = `${date}-${idx}`;
  const safeAway = g.away.replace(/'/g, "\\'");
  const safeHome = g.home.replace(/'/g, "\\'");

  return `
    <div class="game-row ${rowClass}" style="border-left: 4px solid ${pickProb >= 63 ? '#F59E0B' : pickProb < 55 ? '#94A3B8' : (g.pick === g.away ? awayColor : homeColor)}">
      ${bannerHtml}
      <div style="padding:12px 16px">
        <div class="gr-header">
          <div class="gr-teams">
            <span class="gr-team" style="color:${awayColor}">${g.away}</span>
            ${(g.away_score != null && g.home_score != null) ? `<span class="gr-score-box"><span class="gr-score ${g.away_score > g.home_score ? 'gr-score-win' : 'gr-score-lose'}">${g.away_score}</span><span class="gr-score-sep">–</span><span class="gr-score ${g.home_score > g.away_score ? 'gr-score-win' : 'gr-score-lose'}">${g.home_score}</span></span>` : ''}
            <span class="gr-vs">@</span>
            <span class="gr-team" style="color:${homeColor}">${g.home}</span>
          </div>
          <div class="gr-badges">
            ${dhBadge}
            ${hasResult ? '<span class="gr-status gs-final">FINAL</span>' : '<span class="gr-status gs-sched">Scheduled</span>'}
            ${verdBadge}
            ${hcBadge}${lcBadge}
          </div>
        </div>

        <div class="gr-sp-grid">
          ${spCol(g.away, awayShort, awayColor, awayProb, g.away_sp_era, g.away_sp_trend, aSp, aBp, g.away_bp_era, true)}
          <div class="gr-sp-divider"></div>
          ${spCol(g.home, homeShort, homeColor, homeProb, g.home_sp_era, g.home_sp_trend, hSp, hBp, g.home_bp_era, false)}
        </div>

        <div class="gr-bottom">
          <div class="gr-prob-wrap">
            <div class="gr-prob-lbl">Win Probability</div>
            <div class="gr-prob-bar">
              <div class="gr-prob-away" style="width:${Math.round(awayProb)}%">${awayProb >= 12 ? Math.round(awayProb)+'%' : ''}</div>
              <div class="gr-prob-home" style="width:${Math.round(homeProb)}%">${homeProb >= 12 ? Math.round(homeProb)+'%' : ''}</div>
            </div>
            <div class="gr-prob-labels">
              <span class="away-lbl">${awayShort}</span>
              <span class="home-lbl">${homeShort}</span>
            </div>
          </div>
          <div class="gr-pick-box">
            <div class="gr-pick-lbl">🎯 Model Pick</div>
            <div class="gr-pick-team">${shortTeam(g.pick)} ${Math.round(g.pick_prob)}%</div>
            ${resultLine}
          </div>
        </div>
      </div>

      <button class="gc-expand-btn" id="gc-btn-${gameId}" onclick="toggleDetails('${gameId}','${date}','${safeAway}','${safeHome}')">
        ▼ View Full Pitcher & Scorecard Details
      </button>
      <div class="gc-detail" id="gc-detail-${gameId}"></div>
    </div>`;
}

//  Predictions 캐시 & 로더
// ════════════════════════════════════════
const predictionsCache = {};

async function loadPredictions(date) {
  if (predictionsCache[date] !== undefined) return predictionsCache[date];

  // KST 기준 오늘 날짜 (UTC+9)
  const now = new Date();
  const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  const today = kst.toISOString().slice(0, 10);

  const urls = [];
  // predictions.json은 항상 시도 (오늘 날짜와 일치하는 게임이 있을 수 있음)
  if (date === today) urls.push('predictions.json');
  urls.push(`output/predictions_${date}.js`);
  urls.push(`predictions_${date}.js`);
  // 혹시 predictions.json에 해당 날짜 데이터가 있을 수 있어 fallback으로 추가
  if (date !== today) urls.push('predictions.json');

  for (const url of urls) {
    try {
      const resp = await fetch(url + '?t=' + Date.now());
      if (!resp.ok) continue;
      let data;
      if (url.endsWith('.json')) {
        data = await resp.json();
      } else {
        const text = await resp.text();
        const match = text.match(/window\.PREDICTIONS_DATA\s*=\s*([\s\S]+?);\s*$/m);
        if (!match) continue;
        data = JSON.parse(match[1]);
      }
      let arr = Array.isArray(data) ? data : [];
      // predictions.json fallback: 해당 날짜 게임만 필터링
      if (url.endsWith('.json') && arr.length > 0 && arr[0]?.date !== date) {
        arr = arr.filter(g => g.date === date);
      }
      if (arr.length > 0) {
        predictionsCache[date] = arr;
        return predictionsCache[date];
      }
    } catch {}
  }

  predictionsCache[date] = null;
  return null;
}

async function toggleDetails(id, date, away, home) {
  const detailEl = document.getElementById(`gc-detail-${id}`);
  const btnEl    = document.getElementById(`gc-btn-${id}`);
  if (!detailEl) return;

  const isOpen = detailEl.classList.contains('open');
  if (isOpen) {
    detailEl.classList.remove('open');
    if (btnEl) btnEl.textContent = '▼ View Full Pitcher & Scorecard Details';
    return;
  }

  detailEl.innerHTML = '<div class="gc-detail-loading"><div class="spinner"></div><div style="margin-top:8px;">Loading game details…</div></div>';
  detailEl.classList.add('open');
  if (btnEl) btnEl.textContent = '▲ Hide Details';

  try {
    const preds = await loadPredictions(date);
    const fullGame = preds ? preds.find(g => g.away === away && g.home === home) : null;
    if (fullGame) {
      detailEl.innerHTML = renderFullDetail(fullGame);
    } else {
      detailEl.innerHTML = '<div class="gc-detail-loading" style="padding:20px;">📊 Detailed data not available for this date.<br><small style="color:var(--muted)">Available from 2026-06-23 onwards.</small></div>';
    }
  } catch(e) {
    detailEl.innerHTML = `<div class="gc-detail-loading" style="color:var(--red);">Failed to load: ${e.message}</div>`;
  }
}

//  Full GameCard detail renderer
// ════════════════════════════════════════
function fmtAvg(v) {
  if (v == null) return '—';
  return '.' + String(Math.round(v * 1000)).padStart(3, '0');
}

function renderTrendBadge(spd) {
  if (!spd) return '';
  const trend = (spd.trend || '').toLowerCase();
  const rest  = spd.rest_days;
  const note  = spd.rest_note;
  const conf  = spd.sample_confidence;
  const ng    = spd.n_games ?? 0;

  let html = '<div class="gc-trend-row">';
  if (trend === 'hot')       html += '<span class="gc-badge gc-badge-hot">🔥 Hot</span>';
  else if (trend === 'cold') html += '<span class="gc-badge gc-badge-cold">🥶 Cold</span>';
  else                       html += '<span class="gc-badge gc-badge-stable">➡️ Stable</span>';

  if (note === 'short_rest')  html += `<span class="gc-badge gc-badge-shortrest">⚡ Short rest ${rest}d</span>`;
  else if (note === 'extra_rest') html += `<span class="gc-badge gc-badge-extrarest">💤 Extra rest ${rest}d</span>`;
  else if (rest != null)      html += `<span class="gc-badge gc-badge-rest">Rest ${rest}d</span>`;

  if (conf != null && conf < 1.0) html += `<span class="gc-badge" style="background:#FEFCE8;color:#854D0E;border:1px solid #FDE047">📊 ${ng} games</span>`;
  if (spd.recent_bad_start)   html += `<span class="gc-badge" style="background:#FFF7ED;color:#C2410C;border:1px solid #FDBA74">⚠️ Rough recent start</span>`;
  html += '</div>';
  return html;
}

function renderGamelog(gamelog) {
  if (!gamelog || !gamelog.length) return '';
  const rows = [...gamelog].reverse().map(g => {
    const era = g.era;
    const ec = era == null ? 'inherit' : era <= 2.0 ? '#16A34A' : era <= 3.5 ? '#2563EB' : era <= 5.5 ? '#64748B' : '#DC2626';
    const dc = g.decision === 'W' ? '#16A34A' : g.decision === 'L' ? '#DC2626' : '#94A3B8';
    const rb = era > 5.5 ? 'background:rgba(220,38,38,0.04)' : '';
    return `<tr style="${rb}">
      <td>${(g.date||'').slice(5)}</td><td>${g.opp||''}</td>
      <td style="text-align:center;font-weight:700;color:${dc}">${g.decision??'—'}</td>
      <td style="text-align:center">${g.ip??'—'}</td><td style="text-align:center">${g.h??'—'}</td>
      <td style="text-align:center">${g.er??'—'}</td><td style="text-align:center">${g.bb??'—'}</td>
      <td style="text-align:center">${g.so??'—'}</td>
      <td style="text-align:center;font-weight:700;color:${ec}">${era!=null?era.toFixed(2):'—'}</td>
    </tr>`;
  }).join('');
  return `<div class="gc-gamelog-wrap">
    <div class="gc-gamelog-title">Last ${gamelog.length} Starts</div>
    <div class="gc-gamelog-scroll">
      <table>
        <thead><tr><th>Date</th><th>Opp</th><th>W/L</th><th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>ERA</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderBatStats(bd, isHome, color) {
  if (!bd) return '<div style="font-size:11px;color:var(--muted)">No batting data</div>';
  const avg  = fmtAvg(bd.recent_avg);
  const ops  = bd.season_ops  != null ? bd.season_ops.toFixed(3)  : '—';
  const rpg  = bd.runs_per_g  != null ? bd.runs_per_g.toFixed(1)  : '—';
  const hrpg = bd.hr_per_g    != null ? bd.hr_per_g.toFixed(1)    : '—';
  const exp  = bd.explosive_games ?? 0;
  const stars = exp >= 3 ? '★★★' : exp === 2 ? '★★☆' : exp === 1 ? '★☆☆' : '☆☆☆';
  const hS = bd.home_split, aS = bd.away_split;
  const usedSplit = isHome ? hS : aS;
  const usedAvg   = usedSplit ? fmtAvg(usedSplit.recent_avg) : null;

  const buildSplit = (label, split, isUsed) => {
    if (!split) return '';
    const sAvg = fmtAvg(split.recent_avg);
    const sRpg = split.runs_per_g != null ? split.runs_per_g.toFixed(1) : '—';
    const sHr  = split.hr_per_g   != null ? split.hr_per_g.toFixed(1)  : '—';
    const n = split.n_games ?? 10;
    return `<div class="gc-split-col${isUsed?' used':''}">
      <div class="gc-split-col-lbl">${label}${isUsed?' <span style="background:#0EA5E9;color:#fff;border-radius:3px;padding:1px 4px;font-size:8px">Used</span>':''}</div>
      <div class="gc-split-avg">${sAvg}</div>
      <div class="gc-split-sub">${sRpg} R/G · ${sHr} HR/G</div>
      <div style="font-size:9px;color:var(--muted)">(${n}G)</div>
    </div>`;
  };

  const splitHtml = (hS || aS) ? `<div class="gc-split-box">
    <div class="gc-split-header">
      <div class="gc-split-title">Home / Away Split (last 10G each)</div>
      ${usedAvg ? `<div style="font-size:9px;color:var(--muted)">Overall <b style="color:var(--text)">${avg}</b> → ${isHome?'Home':'Away'} <b style="color:#0369A1">${usedAvg}</b></div>` : ''}
    </div>
    <div class="gc-split-grid">
      ${buildSplit('🏠 Home', hS, isHome)}
      ${buildSplit('✈️ Away', aS, !isHome)}
    </div>
    <div class="gc-split-note">* Batting score from overall recent stats. Split avg used as adjustment only.</div>
  </div>` : '';

  return `<div class="gc-bat-stats">
    <div class="gc-bat-stat"><span class="gc-bat-stat-lbl">AVG <span style="font-size:9px">(recent 10G)</span></span><span class="gc-bat-stat-val">${avg}</span></div>
    <div class="gc-bat-stat"><span class="gc-bat-stat-lbl">OPS <span style="font-size:9px">(season)</span></span><span class="gc-bat-stat-val">${ops}</span></div>
    <div class="gc-bat-stat"><span class="gc-bat-stat-lbl">R/G</span><span class="gc-bat-stat-val">${rpg}</span></div>
    <div class="gc-bat-stat"><span class="gc-bat-stat-lbl">HR/G</span><span class="gc-bat-stat-val">${hrpg}</span></div>
  </div>
  ${splitHtml}
  <div style="font-size:10px;color:var(--muted);margin-top:6px">Explosive games <span style="color:#F59E0B;font-weight:700">${stars}</span></div>`;
}

function renderScoreBar(label, value, color) {
  const pct = Math.min(100, Math.round(value || 0));
  return `<div class="gc-sc-bar-row">
    <div class="gc-sc-bar-lbl">${label}</div>
    <div class="gc-sc-bar-track"><div class="gc-sc-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="gc-sc-bar-val">${pct}</div>
  </div>`;
}

function renderTeamPanel(teamAbbr, color, sc, pitcherName, pitcherStats, gamelog, isHome) {
  const spd  = sc?.sp_detail || {};
  const eraRaw = pitcherStats?.era ?? spd.era;
  const era  = eraRaw != null ? (typeof eraRaw === 'number' ? eraRaw.toFixed(2) : eraRaw) : '—';
  const whip = spd.whip    != null ? spd.whip.toFixed(2)    : (pitcherStats?.whip ?? '—');
  const k9   = spd.k9      != null ? spd.k9.toFixed(1)      : '—';
  const ip   = spd.avg_ip  != null ? spd.avg_ip.toFixed(1)  : '—';
  const l3   = spd.last3_era != null ? spd.last3_era.toFixed(2) : '—';
  const wl   = pitcherStats?.wins != null ? `${pitcherStats.wins}W-${pitcherStats.losses}L` : '—';

  const meta = [];
  if (spd.age) meta.push(`Age ${spd.age}`);
  if (spd.fb_velo) meta.push(`<b style="color:#0EA5E9">${spd.fb_velo} mph</b> (FB)`);
  if (spd.secondary_pitches?.length) meta.push(spd.secondary_pitches.join(' / '));

  const batScore = sc?.bat_score ?? 0;

  return `<div class="gc-team-panel">
    <div class="gc-panel-label" style="color:${color}">${teamAbbr} · Starting Pitcher</div>
    <div class="gc-pitcher-name">${pitcherName || 'TBD'}</div>
    ${meta.length ? `<div class="gc-pitcher-meta">${meta.join(' · ')}</div>` : ''}
    <div class="gc-stats-grid">
      <div class="gc-stat-cell"><span class="gc-stat-lbl">ERA</span><span class="gc-stat-val">${era}</span></div>
      <div class="gc-stat-cell"><span class="gc-stat-lbl">WHIP</span><span class="gc-stat-val">${whip}</span></div>
      <div class="gc-stat-cell"><span class="gc-stat-lbl">K/9</span><span class="gc-stat-val">${k9}</span></div>
      <div class="gc-stat-cell"><span class="gc-stat-lbl">Avg IP</span><span class="gc-stat-val">${ip}</span></div>
      <div class="gc-stat-cell"><span class="gc-stat-lbl">Last 3 ERA</span><span class="gc-stat-val">${l3}</span></div>
      <div class="gc-stat-cell"><span class="gc-stat-lbl">Record</span><span class="gc-stat-val">${wl}</span></div>
    </div>
    ${renderTrendBadge(spd)}
    ${renderGamelog(gamelog)}
    <div class="gc-divider"></div>
    <div class="gc-bat-header">
      <span class="gc-bat-title">🏏 Recent Batting</span>
      <span class="gc-bat-score" style="color:${color}">${batScore.toFixed(1)}<span style="font-size:10px;font-weight:600;color:var(--muted);margin-left:2px">pts</span></span>
    </div>
    ${renderBatStats(sc?.bat_detail, isHome, color)}
    <div class="gc-divider"></div>
    <div class="gc-sc-title">📊 Scorecard</div>
    ${renderScoreBar('SP',      sc?.sp_score,  '#0EA5E9')}
    ${renderScoreBar('Bullpen', sc?.bp_score,  '#8B5CF6')}
    ${renderScoreBar('Batting', sc?.bat_score, '#D97706')}
    ${renderScoreBar('Sit',     sc?.sit_score, '#F59E0B')}
    <div class="gc-total-row" style="background:${color}10">
      <span class="gc-total-lbl">Total Score</span>
      <span class="gc-total-val" style="color:${color}">${(sc?.total ?? 0).toFixed(1)}</span>
    </div>
  </div>`;
}

function renderFullDetail(game) {
  const awayName  = game.away || '';
  const homeName  = game.home || '';
  const awayAbbr  = shortTeam(awayName);
  const homeAbbr  = shortTeam(homeName);
  const awayColor = TEAM_COLOR(awayName);
  const homeColor = TEAM_COLOR(homeName);
  const sc  = game.scorecard || {};
  const scA = sc.away || {};
  const scH = sc.home || {};
  const awayProb    = Math.round(game.win_prob?.away || 0);
  const homeProb    = Math.round(game.win_prob?.home || 0);
  const pickIsAway  = game.model_winner === awayName;
  const pickProb    = pickIsAway ? awayProb : homeProb;

  // Summary badges
  const chip = (bg, color, border, text) =>
    `<span class="gc-chip" style="background:${bg};color:${color};border-color:${border}">${text}</span>`;
  const chips = [];
  const batSrc = game.scorecard?.bat_source;
  if (game.lineup_confirmed)       chips.push(chip('#F0FDF4','#15803D','#86EFAC','✅ Lineup Confirmed'));
  else if (batSrc === 'team_stats') chips.push(chip('#FFF7ED','#C2410C','#FED7AA','⚠️ Lineup Pending'));
  else if (batSrc === 'prev_day')   chips.push(chip('#FFFBEB','#92400E','#FDE68A','🕐 Awaiting Today\'s Lineup'));
  if (game.sp_tbd?.any)             chips.push(chip('#F5F3FF','#6D28D9','#DDD6FE','🔄 SP TBD'));
  if (game.sp_bat_conflict)         chips.push(chip('#FFF7ED','#C2410C','#FED7AA','⚡ SP↔BAT Conflict'));
  if (game.edge != null) {
    const ev = parseFloat(game.edge);
    if (Math.abs(ev) <= 3) chips.push(chip('#F1F5F9','#475569','#CBD5E1','➖ Near Market'));
    else if (ev > 3) chips.push(chip('#F0FDF4','#15803D','#86EFAC',`📈 Edge +${ev.toFixed(1)}%p`));
    else chips.push(chip('#FFF1F2','#B91C1C','#FCA5A5',`📉 Edge ${ev.toFixed(1)}%p`));
    if (game.kalshi_prob != null) chips.push(chip('#F8FAFC','#64748B','#E2E8F0',`Kalshi ${game.kalshi_prob}%`));
  }
  const exp = game.expected_score;
  if (exp?.away || exp?.home) chips.push(chip('#F8FAFC','#475569','#E2E8F0',`🎯 Proj ${(exp.away||0).toFixed(1)}–${(exp.home||0).toFixed(1)}`));
  if (pickProb >= 65) chips.push(chip('#FEF3C7','#78350F','#FCD34D',`⭐ Premium · ${pickProb}%`));
  else if (pickProb >= 63) chips.push(chip('#FEF9C3','#713F12','#FDE047',`🔥 High Conf · ${pickProb}%`));
  else if (pickProb < 55)  chips.push(chip('#F1F5F9','#475569','#CBD5E1',`⚠️ Toss-Up · ${pickProb}%`));
  const awTrend = scA.sp_detail?.trend, hmTrend = scH.sp_detail?.trend;
  const awLast = (game.away_pitcher||'Away SP').split(' ').pop();
  const hmLast = (game.home_pitcher||'Home SP').split(' ').pop();
  if (awTrend === 'hot')  chips.push(chip('#FEF3C7','#92400E','#FDE68A',`🔥 ${awLast} Hot`));
  if (awTrend === 'cold') chips.push(chip('#EFF6FF','#1E40AF','#BFDBFE',`🥶 ${awLast} Cold`));
  if (hmTrend === 'hot')  chips.push(chip('#FEF3C7','#92400E','#FDE68A',`🔥 ${hmLast} Hot`));
  if (hmTrend === 'cold') chips.push(chip('#EFF6FF','#1E40AF','#BFDBFE',`🥶 ${hmLast} Cold`));
  const awStreak = game.away_recent_form?.streak ?? 0;
  const hmStreak = game.home_recent_form?.streak ?? 0;
  const awT = awayName.split(' ').pop(), hmT = homeName.split(' ').pop();
  if (awStreak >= 3)  chips.push(chip('#F0FDF4','#15803D','#86EFAC',`🔥 ${awT} ${awStreak}W streak`));
  if (awStreak <= -3) chips.push(chip('#FFF1F2','#B91C1C','#FCA5A5',`📉 ${awT} ${Math.abs(awStreak)}L streak`));
  if (hmStreak >= 3)  chips.push(chip('#F0FDF4','#15803D','#86EFAC',`🔥 ${hmT} ${hmStreak}W streak`));
  if (hmStreak <= -3) chips.push(chip('#FFF1F2','#B91C1C','#FCA5A5',`📉 ${hmT} ${Math.abs(hmStreak)}L streak`));
  if (game.away_standing?.games_back === '-') chips.push(`<span class="gc-chip" style="background:${awayColor}12;color:${awayColor};border-color:${awayColor}30">🏆 ${awT} Div Leader</span>`);
  if (game.home_standing?.games_back === '-') chips.push(`<span class="gc-chip" style="background:${homeColor}12;color:${homeColor};border-color:${homeColor}30">🏆 ${hmT} Div Leader</span>`);
  const badgesHtml = chips.length ? `<div class="gc-badges-row">${chips.join('')}</div>` : '';

  // Edge bar
  let edgeBar = '';
  if (game.edge != null) {
    const ev = parseFloat(game.edge);
    const pickAbbr = pickIsAway ? awayAbbr : homeAbbr;
    edgeBar = `<div class="gc-edge-bar ${ev > 0 ? 'positive' : 'negative'}" style="margin-top:12px">
      <span class="gc-edge-lbl">vs Kalshi market</span>
      <span class="${ev > 0 ? 'gc-edge-val-pos' : 'gc-edge-val-neg'}">${ev > 0 ? '+' : ''}${ev.toFixed(1)}%p edge · Pick ${pickAbbr}</span>
    </div>`;
  }

  // Notes
  const notesHtml = game.notes ? `<div style="margin-top:10px;padding:8px 10px;background:#FFF7ED;border-left:3px solid #F59E0B;border-radius:0 6px 6px 0;font-size:11px;color:var(--text-sub)">📋 ${game.notes}</div>` : '';

  return `${badgesHtml}${notesHtml}${edgeBar}
    <div style="height:12px"></div>
    <div class="gc-sp-grid">
      ${renderTeamPanel(awayAbbr, awayColor, scA, game.away_pitcher, game.away_pitcher_stats, game.away_pitcher_gamelog, false)}
      ${renderTeamPanel(homeAbbr, homeColor, scH, game.home_pitcher, game.home_pitcher_stats, game.home_pitcher_gamelog, true)}
    </div>`;
}

// ════════════════════════════════════════

// ════════════════════════════════════════
function fmtDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y, m-1, day).getDay()];
  return `${m}/${day} (${dow})`;
}

function fmtDateLong(d) {
  const [y, m, day] = d.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dow = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(y, m-1, day).getDay()];
  return `${dow}, ${months[m-1]} ${day}, ${y}`;
}

function shortTeam(name) {
  const map = {
    'New York Yankees':'NYY','New York Mets':'NYM','Los Angeles Dodgers':'LAD',
    'Los Angeles Angels':'LAA','San Francisco Giants':'SF','San Diego Padres':'SD',
    'Chicago Cubs':'CHC','Chicago White Sox':'CWS','Boston Red Sox':'BOS',
    'Houston Astros':'HOU','Atlanta Braves':'ATL','Philadelphia Phillies':'PHI',
    'Kansas City Royals':'KC','Toronto Blue Jays':'TOR','Minnesota Twins':'MIN',
    'Cleveland Guardians':'CLE','Detroit Tigers':'DET','Baltimore Orioles':'BAL',
    'Tampa Bay Rays':'TB','Seattle Mariners':'SEA','Texas Rangers':'TEX',
    'Oakland Athletics':'OAK','Athletics':'OAK','Arizona Diamondbacks':'ARI',
    'Colorado Rockies':'COL','Miami Marlins':'MIA','Washington Nationals':'WSH',
    'Milwaukee Brewers':'MIL','St. Louis Cardinals':'STL','Pittsburgh Pirates':'PIT',
    'Cincinnati Reds':'CIN',
  };
  return map[name] || name.split(' ').pop().slice(0, 3).toUpperCase();
}
